<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SignalR Test Client</title>

    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: sans-serif;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #messageInput {
            flex-grow: 1;
        }

        #log {
            min-height: 300px;
            padding: 16px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            background: #1e1e1e;
            color: #d4d4d4;
        }
    </style>
</head>

<body>
    <h1>SignalR Test Client</h1>

    <p>
        Connection:
        <strong id="connectionState">Disconnected</strong>
    </p>

    <div class="controls">
        <button id="connectButton">
            Connect
        </button>

        <button id="disconnectButton" disabled>
            Disconnect
        </button>
    </div>

    <div class="controls">
        <input id="messageInput"
               type="text"
               placeholder="Enter a message"
               disabled>

        <button id="sendButton" disabled>
            Send
        </button>
    </div>

    <pre id="log"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
    <script> 
        const connectionState = document.getElementById("connectionState");
        const connectButton = document.getElementById("connectButton");
        const disconnectButton = document.getElementById("disconnectButton");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const logElement = document.getElementById("log");

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/chat")
            .build();

        function log(message) {
            const time = new Date().toLocaleTimeString();

            logElement.textContent += `[${time}] ${message}\n`;
        }

        function setConnected(isConnected) {
            connectionState.textContent =
                isConnected ? "Connected" : "Disconnected";

            connectButton.disabled = isConnected;
            disconnectButton.disabled = !isConnected;
            messageInput.disabled = !isConnected;
            sendButton.disabled = !isConnected;
        }

        connection.on("ReceiveMessage", message => {
            log(`Received: ${message}`);
        });

        connection.onclose(error => {
            setConnected(false);

            if (error) {
                log(`Connection closed with error: ${error}`);
            } else {
                log("Connection closed");
            }
        });

        connectButton.addEventListener("click", async () => {
            connectButton.disabled = true;

            log("Connecting to /chat");

            try {
                await connection.start();

                setConnected(true);

                log(`Connection opened: ${connection.connectionId}`);

                messageInput.focus();
            } catch (error) {
                setConnected(false);

                log(`Connection failed: ${error}`);
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();

            if (message.length === 0) {
                return;
            }

            if (connection.state !== signalR.HubConnectionState.Connected) {
                log("Cannot send: connection is not open");
                return;
            }

            try {
                await connection.invoke("SendMessage", message);

                log(`Sent: ${message}`);

                messageInput.value = "";
                messageInput.focus();
            } catch (error) {
                log(`Send failed: ${error}`);
            }
        }

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        messageInput.addEventListener(
            "keydown",
            event => {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }
        );

        disconnectButton.addEventListener("click", async () => {
            disconnectButton.disabled = true;

            log("Disconnecting");

            try {
                await connection.stop();
            } catch (error) {
                log(`Disconnect failed: ${error}`);
            }
        });
    </script>
</body>
</html>
